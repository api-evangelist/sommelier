name: Sommelier
description: >-
  Sommelier (rebranding to "Somm") is a decentralized asset-management and DeFi
  vault protocol whose smart-contract "cellars" run automated yield strategies
  on Ethereum. It publishes a public, read-only HTTP API that exposes on-chain
  vault performance data — daily and hourly snapshots (APY, TVL, share price,
  total assets), protocol-wide total value locked, per-cellar snapshots, and
  integration datasets for Kelp and ether.fi points and balances. All endpoints
  are unauthenticated GET requests with path-based parameters and a
  { "Response": ... } envelope; the API currently serves the ethereum network.
  Backed by Multicoin Capital.
